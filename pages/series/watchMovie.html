<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Xem Phim - VPlay</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #141414;
            color: white;
            margin: 0;
        }

        .watch-container {
            display: flex;
            padding: 20px 50px;
            gap: 20px;
        }

        .player-left {
            flex: 3;
        }

        .sidebar-right {
            flex: 1;
            background: #1f1f1f;
            border-radius: 10px;
            padding: 15px;
            max-height: 85vh;
            overflow-y: auto;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            background: black;
        }

        .ep-card {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .ep-card:hover {
            background: #06AD00;
        }

        .ep-card img {
            width: 120px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <header>
        <a href="#" id="logo">
            <span>VPlay</span>
        </a>
        <ul class="nav">
            <li><a href="index.html">Trang chủ</a></li>
            <li><a href="#">Phim bộ</a></li>
            <li><a href="#">Phim lẻ</a></li>
            <li><a href="#">Anime</a></li>
            <li><a href="#">Phim chiếu rạp</a></li>
        </ul>
        <div id="options-container">
            <a id="search-button" href="#">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <div id="account-button">
                <div class="user-icon-container">
                    <img src="/assets/avatar_account/475055309_1155935292755304_5561348608603339790_n.jpg"
                        alt="User Icon" height="35px" width="35px" id="user-icon" />
                </div>
            </div>
        </div>
    </header>

    <div class="watch-container">
        <div class="player-left">
            <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
            <h2 id="movie-title">Đang tải...</h2>
            <p id="movie-desc"></p>
        </div>

        <div class="sidebar-right">
            <h3>Danh sách tập phim</h3>
            <div id="episode-list"></div>
        </div>
    </div>

<script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug'); 

    async function init() {
        if (!slug) {
            alert("Không tìm thấy phim!");
            return;
        }

        try {
            const response = await fetch(`https://ophim1.com/phim/${slug}`);
            const data = await response.json();
            const movie = data.movie;
            const episodes = data.episodes[0].server_data;

            document.getElementById('movie-title').innerText = movie.name;
            document.getElementById('movie-desc').innerHTML = movie.content;

            const container = document.getElementById('episode-list');
            container.innerHTML = episodes.map(ep => `
                <div class="ep-card" onclick="loadVideo('${ep.link_embed}')">
                    <div style="padding:10px">
                        <p>Tập ${ep.name}</p>
                    </div>
                </div>
            `).join('');

            if(episodes.length > 0) loadVideo(episodes[0].link_embed);

        } catch (error) {
            console.error("Lỗi load phim:", error);
        }
    }

    function loadVideo(url) {
        document.getElementById('video-iframe').src = url;
    }

    init();
</script>
</body>

</html>
