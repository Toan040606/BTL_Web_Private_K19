<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Xem Phim - VPlay</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* CSS để chia đôi màn hình: Trình phát bên trái, Danh sách tập bên phải */
        body {
            background-color: #141414;
            color: white;
            margin: 0;
        }

        .watch-container {
            display: flex;
            padding: 20px 50px;
            gap: 20px;
        }

        .player-left {
            flex: 3;
        }

        .sidebar-right {
            flex: 1;
            background: #1f1f1f;
            border-radius: 10px;
            padding: 15px;
            max-height: 85vh;
            overflow-y: auto;
        }

        iframe {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            background: black;
        }

        .ep-card {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: #2a2a2a;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
        }

        .ep-card:hover {
            background: #06AD00;
        }

        .ep-card img {
            width: 120px;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <header>
        <a href="#" id="logo">
            <span>VPlay</span>
        </a>
        <ul class="nav">
            <li><a href="#">Trang chủ</a></li>
            <li><a href="#">Phim bộ</a></li>
            <li><a href="#">Phim lẻ</a></li>
            <li><a href="#">Anime</a></li>
            <li><a href="#">Phim chiếu rạp</a></li>
        </ul>
        <div id="options-container">
            <a id="search-button" href="#">
                <i class="fa-solid fa-magnifying-glass"></i>
            </a>
            <div id="account-button">
                <div class="user-icon-container">
                    <img src="/assets/avatar_account/475055309_1155935292755304_5561348608603339790_n.jpg"
                        alt="User Icon" height="35px" width="35px" id="user-icon" />
                </div>
            </div>
        </div>
    </header>

    <div class="watch-container">
        <div class="player-left">
            <iframe id="video-iframe" src="" frameborder="0" allowfullscreen></iframe>
            <h2 id="movie-title">Đang tải...</h2>
            <p id="movie-desc"></p>
        </div>

        <div class="sidebar-right">
            <h3>Danh sách tập phim</h3>
            <div id="episode-list"></div>
        </div>
    </div>

    <script>
        const API_KEY = '6d967a137dbd0d17a690ac58bf76e5ae';
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const type = params.get('type');

        async function init() {
            // 1. Lấy thông tin chung của phim (Tên, mô tả)
            const resDetail = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=${API_KEY}&language=vi-VN`);
            const detail = await resDetail.json();
            document.getElementById('movie-title').innerText = detail.name || detail.title;
            document.getElementById('movie-desc').innerText = detail.overview;

            // 2. Nếu là phim bộ (TV), gọi thêm API để lấy danh sách tập của Season 1
            if (type === 'tv') {
                const resSeason = await fetch(`https://api.themoviedb.org/3/tv/${id}/season/1?api_key=${API_KEY}&language=vi-VN`);
                const seasonData = await resSeason.json();
                renderEpisodes(seasonData.episodes);
                loadVideo(1); // Mặc định chạy tập 1
            } else {
                // Nếu là phim lẻ, ẩn sidebar và chạy phim luôn
                document.querySelector('.sidebar-right').style.display = 'none';
                document.getElementById('video-iframe').src = `https://vidsrc.to/embed/movie/${id}`;
            }
        }

        function renderEpisodes(episodes) {
            const container = document.getElementById('episode-list');
            container.innerHTML = episodes.map(ep => `
                <div class="ep-card" onclick="loadVideo(${ep.episode_number})">
                    <img src="${ep.still_path ? 'https://image.tmdb.org/t/p/w200' + ep.still_path : 'https://via.placeholder.com/200x120'}">
                    <div>
                        <p>Tập ${ep.episode_number}</p>
                        <small>${ep.name}</small>
                    </div>
                </div>
            `).join('');
        }

        function loadVideo(epNum) {
            const iframe = document.getElementById('video-iframe');

            // Sử dụng link nhúng từ vidsrc.xyz hoặc vidsrc.to (đây là các nguồn phổ biến nhất)
            if (type === 'tv') {
                iframe.src = `https://vidsrc.to/embed/tv/${id}/1/${epNum}`;
            } else {
                iframe.src = `https://vidsrc.to/embed/movie/${id}`;
            }

            // Cuộn lên đầu trang để người dùng thấy player ngay
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        init();
    </script>
</body>

</html>
